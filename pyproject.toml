[project]
name = "e-stats-mcp"
version = "0.4.0"
description = "MCP server and CLI for the Japanese government e-Stat API 3.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dnspython>=2.9.0",
    "fastmcp>=4.0.10,<5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.9",
]

[project.scripts]
e-stats-mcp = "e_stats_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e_stats_mcp"]

[tool.ruff.lint]
# Preserve the datetime checks enabled by Ruff before 0.17.
extend-select = [
    "DTZ001",
    "DTZ005",
    "DTZ006",
    "DTZ007",
    "DTZ011",
    "DTZ012",
    "DTZ901",
]
