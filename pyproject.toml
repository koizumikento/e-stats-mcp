[project]
name = "e-stats-mcp"
version = "0.4.0"
description = "MCP server and CLI for the Japanese government e-Stat API 3.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.7,<5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "typer>=0.15.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.8",
]

[project.scripts]
e-stats-mcp = "e_stats_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e_stats_mcp"]
