name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy e_stats_mcp
      - run: uv run pytest
      - run: uv build
      - name: Verify clean wheel install
        shell: bash
        run: |
          WHEEL=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$WHEEL" python - <<'PY'
          import asyncio
          from e_stats_mcp import __version__, mcp

          assert __version__ == "0.4.0"
          assert len(asyncio.run(mcp.list_tools())) == 13
          PY
  sites-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package
