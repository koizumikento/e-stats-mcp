name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy e_stats_mcp
      - run: uv run pytest
      - run: uv build
      - name: Verify clean wheel install
        shell: bash
        run: |
          WHEEL=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$WHEEL" python - <<'PY'
          import asyncio
          from e_stats_mcp import __version__, mcp

          assert __version__ == "0.4.0"
          tools = asyncio.run(mcp.list_tools())
          assert len(tools) == 14
          assert "get_stats_data_bulk_csv" in {tool.name for tool in tools}
          PY
  sites-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package
